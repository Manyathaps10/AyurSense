{% extends "base.html" %} {% block content %}

<section
  class="login-section d-flex align-items-center justify-content-center py-5"
>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h3 class="fw-bold text-success">Welcome Back</h3>
              <p class="text-muted">
                Login to continue your AyurSense journey 🌿
              </p>
            </div>

            <!-- Login Form -->
           <form method="POST" action="{{ url_for('login') }}" autocomplete="on">

  <!-- hidden username field (IMPORTANT trick) -->
  <input type="text" name="username" autocomplete="username" style="opacity:0; position:absolute;">

 <form method="POST" action="{{ url_for('login') }}" autocomplete="on">

  <!-- hidden username for browser detection -->
  <input type="text" name="username" autocomplete="username"
         style="opacity:0; position:absolute;">

  <div class="mb-3">
    <label>Email</label>
    <input
      type="email"
      name="email"
      class="form-control"
      autocomplete="email"
      required
    />
  </div>

  <div class="mb-3">
    <label>Password</label>
    <input
      type="password"
      name="password"
      class="form-control"
      autocomplete="current-password"
      required
    />
  </div>

              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <div class="form-check">
                  <input
  class="form-check-input"
  type="checkbox"
  id="remember"
  name="remember" 
  value="1"
/>
                  <label class="form-check-label" for="remember">
                    Remember Me
                  </label>
                </div>
                <a href="{{ url_for('forgot_password') }}" class="text-success text-decoration-none"
                  >Forgot Password?</a
                >
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success rounded-pill py-2">
                  Login
                </button>
              </div>
            </form>

            <!-- Divider -->
            <div class="text-center my-3 text-muted">— or continue with —</div>

            <!-- Social Login -->
            <div class="d-flex justify-content-center gap-3 mb-3">
              <button type="button" id="googleLogin" class="btn btn-google">
  <i class="fa-brands fa-google"></i>
</button>
            </div>

            <!-- Register Link -->
            <p class="text-center mt-3">
              Don’t have an account?
              <a
                href="{{ url_for('register') }}"
                class="fw-semibold text-success"
                >Register</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCRxM7YreMB9BaF-dWJTDcU-_PoKcqFeQY",
    authDomain: "ayursense-84424.firebaseapp.com",
    projectId: "ayursense-84424",
    appId: "1:288725288592:web:b55345e632fad60b5cba15"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  document.getElementById("googleLogin").addEventListener("click", () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        const user = result.user;

        // 🔥 Flask ko data bhejna
        fetch("/google-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            name: user.displayName,
            email: user.email
          }),
        })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            window.location.href = "/"; // same as normal login
          }
        });

      })
      .catch((error) => {
        alert(error.message);
      });
  });
</script>

{% endblock %}
