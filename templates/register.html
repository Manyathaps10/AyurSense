{% extends "base.html" %} {% block content %}

<section class="register-section py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <h3 class="fw-bold text-success">Create Your Account</h3>
              <p class="text-muted">
                Create your account and start your wellness journey with
                Ayurveda 🌿
              </p>
            </div>

            <!-- Registration Form -->
            <form method="POST" action="/register">
              <!-- Full Name -->
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Enter your full name"
                  required
                />
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>

             <div class="mb-3">
  <label for="password" class="form-label">Password</label>
  <input 
    type="password" 
    class="form-control" 
    id="password" 
    name="password" 
    placeholder="Enter password" 
    required>
  <small id="passwordHelp" class="text-danger d-none">
    Password must be at least 8 characters long
  </small>
</div>

<div class="mb-3">
  <label for="confirm_password" class="form-label">Confirm Password</label>
  <input 
    type="password" 
    class="form-control" 
    id="confirm_password" 
    name="confirm_password" 
    placeholder="Re-enter password" 
    required>
  <small id="matchHelp" class="text-danger d-none">
    Passwords do not match
  </small>
</div>

<script>
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirm_password");
  const passwordHelp = document.getElementById("passwordHelp");
  const matchHelp = document.getElementById("matchHelp");

  // Password length check
  password.addEventListener("input", () => {
    if (password.value.length > 0 && password.value.length < 8) {
      passwordHelp.classList.remove("d-none");
    } else {
      passwordHelp.classList.add("d-none");
    }
  });

  // Password match check
  confirmPassword.addEventListener("input", () => {
    if (confirmPassword.value !== password.value) {
      matchHelp.classList.remove("d-none");
    } else {
      matchHelp.classList.add("d-none");
    }
  });
</script>

              <!-- Submit Button -->
              <div class="d-grid">
                <button type="submit" class="btn btn-success">Register</button>
              </div>
            </form>

               <!-- Divider -->
            <div class="text-center my-3 text-muted">— or signup with —</div>

            <!-- Social Login -->
            <div class="d-flex justify-content-center gap-3 mb-3">
              <button class="btn btn-google">
                <i class="fa-brands fa-google"></i>
              </button>
            </div>

            <!-- Login Redirect -->
            <p class="text-center mt-3">
              Already have an account?
              <a href="/login" class="text-success fw-bold">Login here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
