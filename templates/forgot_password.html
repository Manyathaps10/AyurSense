{% extends "base.html" %} {% block content %}

<section class="d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5">

            <div class="text-center mb-4">
              <h3 class="fw-bold text-success">Forgot Password</h3>
              <p class="text-muted">
                Enter your email to receive reset link 
              </p>
            </div>

            <form method="POST">
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control rounded-pill"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="d-grid">
                <button class="btn btn-success rounded-pill py-2">
                  Send Reset Link
                </button>
              </div>
            </form>

            <p class="text-center mt-3">
              Remember your password?
              <a href="{{ url_for('login') }}" class="text-success fw-semibold">
                Login
              </a>
            </p>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
