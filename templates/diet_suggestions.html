{% extends "base.html" %}
{% block content %}

<style>

.wrapper {
    width: 100%;              /* 🔥 full width */
    min-height: 80vh;

    background: url("/static/images/diet_bg.png") no-repeat center center/cover;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;
}

/* OVERLAY */
.wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(6px);
    z-index: 0;
}

/* MAIN WRAPPER */
.wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    position: relative;
    z-index: 2;
}

/* GLASS CARD */
.main-card {
    width: 600px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    text-align: center;
}

/* TITLE */
.main-card h2 {
    color: #2e7d32;
    margin-bottom: 25px;
}

/* OPTIONS */
.option-btn {
    width: 100%;
    padding: 16px;
    margin: 12px 0;
    border-radius: 15px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #c8e6c9, #e8f5e9);
    transition: all 0.3s ease;
}

.option-btn:hover {
    transform: scale(1.03);
    background: linear-gradient(135deg, #a5d6a7, #c8e6c9);
}

.option-btn.active {
    background: #2e7d32;
    color: white;
}

/* INNER */
.inner-card {
    display: none;
    margin-top: 20px;
    background: white;
    padding: 20px;
    border-radius: 15px;
}

/* INPUT */
select, input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ccc;
}

/* BUTTON */
.btn-main {
    padding: 10px 25px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.btn-main:hover {
    background: #1b5e20;
}

/* RESULT */
.result-card {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

/* RESULT GLASS CARD */
.result-card {
    width: 900px;
    margin: 30px auto;
    padding: 30px;

    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(18px);
    border-radius: 25px;

    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.3);

    position: relative;
    z-index: 2;
}

/* GRID */
.result-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 15px;
}

/* BOXES */
.result-box {
    background: rgba(255,255,255,0.7);
    padding: 15px;
    border-radius: 12px;
    transition: 0.3s;
}

.result-box:hover {
    transform: scale(1.03);
}

.result-card:hover {
    box-shadow: 0 30px 60px rgba(0,0,0,0.3);
}
.symptom-box {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    text-align: left;
}

.chip {
    padding: 8px 14px;
    border-radius: 20px;
    background: #e8f5e9;
    cursor: pointer;
    border: 1px solid #c8e6c9;
    font-size: 13px;
}

.chip.selected {
    background: #2e7d32;
    color: white;
}

label {
    display: block;
    text-align: left;
    margin-top: 10px;
    font-weight: 600;
    color: #2e7d32;
}
select[multiple] {
    height: 120px;
}
.allergy-box {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.chip {
    padding: 8px 14px;
    border-radius: 20px;
    background: #e8f5e9;
    cursor: pointer;
    border: 1px solid #c8e6c9;
    font-size: 13px;
}

</style>

<div class="wrapper">

    <div class="main-card">

        <h2>🌿 Select Your Condition</h2>

        <!-- OPTIONS -->
        <button class="option-btn" onclick="showSection('disease', this)">
            📋 Select Known Condition
        </button>

        <button class="option-btn" onclick="showSection('quiz', this)">
            🧠 Diagnose My Condition
        </button>

        <button class="option-btn" onclick="showSection('fitness', this)">
            🌿 Improve My Wellness
        </button>

        <!-- DISEASE -->
        <div id="disease" class="inner-card">
            <select id="diseaseSelect">
                <option value="">-- Select Disease --</option>
                {% for d in diseases %}
                <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>

            <button class="btn-main" onclick="analyzeDisease()">Continue</button>
        </div>

        <!-- QUIZ -->
        <div id="quiz" class="inner-card">

         <h3>Select your symptoms</h3>

<div class="symptom-box">

{% for s in symptoms %}
<div class="chip" onclick="toggleChip(this)" data-value="{{ s }}">
    {{ s }}
</div>
{% endfor %}

</div>

<select id="stress">
    <option value="">Select Stress Level</option>
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
</select>

<select id="sleep">
    <option value="">Select Sleep Pattern</option>
    <option value="good">Good</option>
    <option value="disturbed">Disturbed</option>
    <option value="poor">Poor</option>
</select>

<button class="btn-main" onclick="submitSymptoms()">Continue</button>

      </div>

   <div id="fitness" class="inner-card">

   <label>Select Allergies (if any)</label>

<div class="allergy-box">

    <div class="chip" onclick="toggleAllergy(this)" data-value="dairy">Dairy</div>
    <div class="chip" onclick="toggleAllergy(this)" data-value="gluten">Gluten</div>
    <div class="chip" onclick="toggleAllergy(this)" data-value="nuts">Nuts</div>
    <div class="chip" onclick="toggleAllergy(this)" data-value="soy">Soy</div>
    <div class="chip" onclick="toggleAllergy(this)" data-value="spicy">Spicy</div>

</div>

    <button class="btn-main" onclick="getWellnessDiet()">
        Continue
    </button>

</div>

    </div>
    <div id="output"></div>

</div>


<script>

function showSection(id, btn){
    document.querySelectorAll(".inner-card").forEach(e => e.style.display="none");
    document.querySelectorAll(".option-btn").forEach(e => e.classList.remove("active"));

    document.getElementById(id).style.display = "block";
    btn.classList.add("active");
}

async function analyzeDisease(){
    let disease = document.getElementById("diseaseSelect").value;

    if(!disease){
        alert("Select disease first");
        return;
    }

    let res = await fetch("/analyze", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({disease})
    });

    let data = await res.json();
    showResult(data);
}

function submitSymptoms(){

    console.log("clicked");

    let selected = document.querySelectorAll(".chip.selected");

    if(selected.length === 0){
        alert("Select symptoms");
        return;
    }

    let symptoms = [...selected].map(el => el.dataset.value).join(", ");

    let stress = document.getElementById("stress").value;
    let sleep = document.getElementById("sleep").value;

    if(!stress || !sleep){
        alert("Select stress and sleep");
        return;
    }

    fetch("/analyze", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            symptoms: symptoms,
            stress: stress,
            sleep: sleep
        })
    })
    .then(res => res.json())
    .then(data => {
        console.log(data);

        if(data.predictions){
            showDiagnosisResult(data);
        } else {
            showResult(data);
        }
    });
}

function getWellnessDiet(){

    let selected = document.querySelectorAll(".allergy-box .chip.selected");
    let allergies = [...selected].map(el => el.dataset.value);

    let plan = {

        Monday: "Morning: Warm water + lemon<br>Breakfast: Oats<br>Lunch: Roti + Dal<br>Dinner: Khichdi",

        Tuesday: "Morning: Detox water<br>Breakfast: Poha<br>Lunch: Roti + Rajma<br>Dinner: Soup",

        Wednesday: "Morning: Warm water<br>Breakfast: Upma<br>Lunch: Roti + Chole<br>Dinner: Dal",

        Thursday: "Morning: Lemon water<br>Breakfast: Dalia<br>Lunch: Roti + Veg<br>Dinner: Khichdi",

        Friday: "Morning: Warm water<br>Breakfast: Fruits<br>Lunch: Roti + Paneer<br>Dinner: Soup",

        Saturday: "Morning: Detox drink<br>Breakfast: Idli<br>Lunch: Roti + Dal<br>Dinner: Sabzi",

        Sunday: "Morning: Warm water<br>Breakfast: Smoothie<br>Lunch: Roti + Curry<br>Dinner: Light khichdi"
    };

    // 🔥 APPLY ALLERGIES
    for(let day in plan){

        if(allergies.includes("dairy")){
            plan[day] = plan[day].replace("Paneer", "Tofu");
        }

        if(allergies.includes("gluten")){
            plan[day] = plan[day].replaceAll("Roti", "Rice / Millet roti");
        }

        if(allergies.includes("nuts")){
        }

        if(allergies.includes("soy")){
        }

        if(allergies.includes("spicy")){
        }
    }

    // 🔥 OUTPUT
    let html = `<div class="result-card">
        <h2>🌿 7-Day Wellness Diet Plan</h2>
    `;

    for(let day in plan){
        html += `
        <div class="result-box" style="margin-top:10px;">
            <b>${day}</b><br>${plan[day]}
        </div>
        `;
    }

    html += `</div>`;

    document.getElementById("output").innerHTML = html;
}

function showResult(data){

    let html = `
    <div class="result-card">

        <h2>${data.Disease}</h2>

        <div class="result-grid">

            <div class="result-box"><b>Symptoms</b><br>${data.Symptoms}</div>
            <div class="result-box"><b>Severity</b><br>${data.Severity}</div>

            <div class="result-box"><b>Tests</b><br>${data.Tests}</div>
            <div class="result-box"><b>Duration</b><br>${data.Duration}</div>

            <div class="result-box"><b>Risk Factors</b><br>${data.Risk}</div>
            <div class="result-box"><b>Environment Factors</b><br>${data.Environmental}</div>

            <div class="result-box"><b>Herbs</b><br>${data.Herbs}</div>
            <div class="result-box"><b>Formulation</b><br>${data.Formulation}</div>

            <div class="result-box"><b>Remedies</b><br>${data.Remedies}</div>
            <div class="result-box"><b>Prevention</b><br>${data.Prevention}</div>

            <div class="result-box"><b>Prognosis</b><br>${data.Prognosis}</div>
            <div class="result-box"><b>Complications</b><br>${data.Complications}</div>

        </div>

        <h3 style="margin-top:20px;">🥗 Diet Recommendation</h3>
        <div class="result-box">${data.Diet}</div>

        <h3 style="margin-top:15px;">🧑‍⚕️ Patient Advice</h3>
        <div class="result-box">${data.Patient}</div>

    </div>
    `;

    document.getElementById("output").innerHTML = html;
}

function showDiagnosisResult(data){

    let html = `<h2>🧠 Possible Conditions</h2>`;

    data.predictions.forEach((d, i) => {

        // 🔥 COLOR LOGIC YAHAN
        let color = d.confidence === "High" ? "green" :
                    d.confidence === "Medium" ? "orange" : "red";

        html += `
        <div class="result-card">

            <h3>${i+1}. ${d.Disease}</h3>

            <p style="color:${color}; font-weight:bold;">
                Confidence: ${d.confidence}
            </p>

            <p><b>Symptoms:</b> ${d.Symptoms}</p>
            <p><b>Severity:</b> ${d.Severity}</p>
            <p><b>Tests:</b> ${d.Tests}</p>
            <p><b>Diet:</b> ${d.Diet}</p>
            <p><b>Risk Factors:</b> ${d.Risk}</p>
            <p><b>Environment Factors:</b> ${d.Environmental}</p>

        </div>
        `;
    });

    document.getElementById("output").innerHTML = html;
}

function toggleChip(el){
    el.classList.toggle("selected");
}
function toggleAllergy(el){
    el.classList.toggle("selected");
}
</script>

{% endblock %}
