{% extends "base.html" %}
{% block content %}

<div class="container py-5" style="max-width:800px;">
  <h2 class="text-success text-center mb-4" style="font-family:'Georgia', serif;">Get in Touch with Us 🌿</h2>
  <p class="text-center text-muted mb-5">Have questions, suggestions, or feedback? Send us a message and we’ll get back to you soon!</p>

  <form id="contactForm">
    <div class="mb-3">
      <label for="name" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" rows="5" placeholder="Write your message here..." required></textarea>
    </div>

    <button type="submit" class="btn btn-success w-100">Send Message</button>
  </form>

  <!-- Contact / Info -->
  <div class="mt-5 text-center">
    <h5>Contact Us</h5>
    <p>Email: ayursense_support@wellness.com</p>
    <p>Phone: +91 98765 43210</p>
  </div>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();

  if(name && email && message){
    alert(`Thank you, ${name}! Your message has been sent. 🌿`);
    this.reset();
  } else {
    alert("Please fill in all fields.");
  }
});
</script>

{% endblock %}
