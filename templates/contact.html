{% extends "base.html" %}
{% block content %}

<div class="container py-5" style="max-width:800px;">

  <h2 class="text-success text-center mb-3" style="font-family:'Georgia', serif;">
    Connect with AyurSense 🌿
  </h2>

  <p class="text-center text-muted mb-5">
    Share your feedback, suggestions, or experiences with us. Your voice helps us improve.
  </p>

  <form action="/submit-form" method="POST" class="p-4 shadow-sm rounded">

    <!-- Name -->
    <input type="text" name="name" class="form-control mb-3" placeholder="Your Name" required>

    <!-- Email -->
    <input type="email" name="email" class="form-control mb-3" placeholder="Your Email" required>

    <!-- TYPE SELECT -->
    <select name="type" class="form-select mb-3" required>
      <option value="">Select Type</option>
      <option value="Feedback">Feedback</option>
      <option value="Suggestion">Suggestion</option>
      <option value="Complaint">Complaint</option>
      <option value="Testimonial">Testimonial</option>
    </select>

    <!-- Message -->
    <textarea name="message" class="form-control mb-3" rows="4" placeholder="Write here..." required></textarea>

    <button type="submit" class="btn btn-success w-100">
      Submit
    </button>

  </form>


</div>

{% endblock %}
